services:
  db:
    platform: linux/arm64
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/postgresql.raspberry-pi.conf:/etc/postgresql/postgresql.conf:ro
    shm_size: "128mb"

  backend:
    platform: linux/arm64
    environment:
      ENVIRONMENT: production
      OCR_PDF_PAGE_LIMIT: ${OCR_PDF_PAGE_LIMIT:-2}
      OCR_PDF_RENDER_DPI: ${OCR_PDF_RENDER_DPI:-120}
      OCR_IMAGE_MAX_PIXELS: ${OCR_IMAGE_MAX_PIXELS:-12000000}
    deploy:
      resources:
        limits:
          memory: 384M

  ocr-worker:
    platform: linux/arm64
    environment:
      ENVIRONMENT: production
      OCR_PDF_PAGE_LIMIT: ${OCR_PDF_PAGE_LIMIT:-2}
      OCR_PDF_RENDER_DPI: ${OCR_PDF_RENDER_DPI:-120}
      OCR_IMAGE_MAX_PIXELS: ${OCR_IMAGE_MAX_PIXELS:-12000000}
      OCR_WORKER_POLL_SECONDS: ${OCR_WORKER_POLL_SECONDS:-10}
      OCR_PROCESSING_TIMEOUT_SECONDS: ${OCR_PROCESSING_TIMEOUT_SECONDS:-1800}
    deploy:
      resources:
        limits:
          memory: 512M

  frontend:
    platform: linux/arm64
    build:
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    deploy:
      resources:
        limits:
          memory: 256M

  nginx:
    image: nginx:1.27-alpine
    platform: linux/arm64
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
