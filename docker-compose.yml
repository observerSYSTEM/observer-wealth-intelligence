services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-observer_wealth}
      POSTGRES_USER: ${POSTGRES_USER:-observer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting Compose}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-observer} -d ${POSTGRES_DB:-observer_wealth}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      args:
        APP_UID: ${PUID:-10001}
        APP_GID: ${PGID:-10001}
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-Observer Wealth Intelligence}
      APP_VERSION: ${APP_VERSION:-1.0.0-rc.1}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PUID: ${PUID:-10001}
      PGID: ${PGID:-10001}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env before starting Compose}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env before starting Compose}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000","http://localhost:8080"]}
      RECEIPT_MAX_FILE_SIZE_BYTES: ${RECEIPT_MAX_FILE_SIZE_BYTES:-10485760}
      RECEIPT_STORAGE_PATH: ${RECEIPT_STORAGE_PATH:-data/receipts}
      ASSET_STORAGE_PATH: ${ASSET_STORAGE_PATH:-data/assets}
      VAULT_STORAGE_PATH: ${VAULT_STORAGE_PATH:-data/vault}
      OCR_STORAGE_PATH: ${OCR_STORAGE_PATH:-data/ocr}
      BACKUP_STORAGE_PATH: ${BACKUP_STORAGE_PATH:-data/backups}
      VAULT_MAX_FILE_SIZE_BYTES: ${VAULT_MAX_FILE_SIZE_BYTES:-26214400}
      EASYOCR_LANGUAGES: ${EASYOCR_LANGUAGES:-["en"]}
      OCR_LOW_CONFIDENCE_THRESHOLD: ${OCR_LOW_CONFIDENCE_THRESHOLD:-70}
      OCR_PDF_PAGE_LIMIT: ${OCR_PDF_PAGE_LIMIT:-3}
      OCR_PDF_RENDER_DPI: ${OCR_PDF_RENDER_DPI:-150}
      OCR_IMAGE_MAX_PIXELS: ${OCR_IMAGE_MAX_PIXELS:-20000000}
      OCR_MAX_RETRIES: ${OCR_MAX_RETRIES:-3}
      OCR_WORKER_POLL_SECONDS: ${OCR_WORKER_POLL_SECONDS:-5}
      OCR_PROCESSING_TIMEOUT_SECONDS: ${OCR_PROCESSING_TIMEOUT_SECONDS:-1800}
      TELEGRAM_NOTIFICATIONS_ENABLED: ${TELEGRAM_NOTIFICATIONS_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      BACKUP_SCHEDULE_ENABLED: ${BACKUP_SCHEDULE_ENABLED:-false}
      BACKUP_SCHEDULE_TIME: ${BACKUP_SCHEDULE_TIME:-02:30}
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy

  ocr-worker:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      args:
        APP_UID: ${PUID:-10001}
        APP_GID: ${PGID:-10001}
    command: ["python", "-m", "app.workers.ocr_worker"]
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-Observer Wealth Intelligence}
      APP_VERSION: ${APP_VERSION:-1.0.0-rc.1}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PUID: ${PUID:-10001}
      PGID: ${PGID:-10001}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env before starting Compose}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env before starting Compose}
      RECEIPT_STORAGE_PATH: ${RECEIPT_STORAGE_PATH:-data/receipts}
      ASSET_STORAGE_PATH: ${ASSET_STORAGE_PATH:-data/assets}
      VAULT_STORAGE_PATH: ${VAULT_STORAGE_PATH:-data/vault}
      OCR_STORAGE_PATH: ${OCR_STORAGE_PATH:-data/ocr}
      BACKUP_STORAGE_PATH: ${BACKUP_STORAGE_PATH:-data/backups}
      EASYOCR_LANGUAGES: ${EASYOCR_LANGUAGES:-["en"]}
      OCR_LOW_CONFIDENCE_THRESHOLD: ${OCR_LOW_CONFIDENCE_THRESHOLD:-70}
      OCR_PDF_PAGE_LIMIT: ${OCR_PDF_PAGE_LIMIT:-3}
      OCR_PDF_RENDER_DPI: ${OCR_PDF_RENDER_DPI:-150}
      OCR_IMAGE_MAX_PIXELS: ${OCR_IMAGE_MAX_PIXELS:-20000000}
      OCR_MAX_RETRIES: ${OCR_MAX_RETRIES:-3}
      OCR_WORKER_POLL_SECONDS: ${OCR_WORKER_POLL_SECONDS:-5}
      OCR_PROCESSING_TIMEOUT_SECONDS: ${OCR_PROCESSING_TIMEOUT_SECONDS:-1800}
      TELEGRAM_NOTIFICATIONS_ENABLED: ${TELEGRAM_NOTIFICATIONS_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "gosu \"$${APP_USER:-owi}\" python -m app.workers.ocr_worker --healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
