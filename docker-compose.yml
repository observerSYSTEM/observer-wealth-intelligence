services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-observer_wealth}
      POSTGRES_USER: ${POSTGRES_USER:-observer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-observer-local-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-observer} -d ${POSTGRES_DB:-observer_wealth}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-Observer Wealth Intelligence}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SECRET_KEY: ${SECRET_KEY:-development-secret-change-before-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://observer:observer-local-password@db:5432/observer_wealth}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000","http://localhost:8080"]}
      RECEIPT_MAX_FILE_SIZE_BYTES: ${RECEIPT_MAX_FILE_SIZE_BYTES:-10485760}
      RECEIPT_STORAGE_PATH: ${RECEIPT_STORAGE_PATH:-data/receipts}
      ASSET_STORAGE_PATH: ${ASSET_STORAGE_PATH:-data/assets}
      VAULT_STORAGE_PATH: ${VAULT_STORAGE_PATH:-data/vault}
      OCR_STORAGE_PATH: ${OCR_STORAGE_PATH:-data/ocr}
      VAULT_MAX_FILE_SIZE_BYTES: ${VAULT_MAX_FILE_SIZE_BYTES:-26214400}
      EASYOCR_LANGUAGES: ${EASYOCR_LANGUAGES:-["en"]}
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
