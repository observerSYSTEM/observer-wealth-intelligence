name: CI

on:
  push:
    branches: ["main", "release/**"]
  pull_request:
    branches: ["main", "release/**"]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint backend
        working-directory: backend
        run: ruff check .
      - name: Compile backend
        working-directory: backend
        run: python -m compileall app alembic
      - name: Test backend
        working-directory: backend
        run: pytest
      - name: Typecheck backend
        working-directory: backend
        run: mypy app

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose files
        run: |
          docker compose -f docker-compose.yml config
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config
          SECRET_KEY=ci-secret-ci-secret-ci-secret-ci-secret docker compose -f docker-compose.yml -f docker-compose.prod.yml config
          SECRET_KEY=ci-secret-ci-secret-ci-secret-ci-secret docker compose -f docker-compose.yml -f docker-compose.pi.yml config
